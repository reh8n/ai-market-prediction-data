services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://market:market@db:5432/market
      DATA_DIR: /data
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-null}
      EXTRACTION_API_KEY: ${EXTRACTION_API_KEY:-}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-}
      ENABLE_WHISPER_FALLBACK: ${ENABLE_WHISPER_FALLBACK:-false}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - appdata:/data

volumes:
  pgdata:
  appdata:
